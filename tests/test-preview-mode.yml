name: Test preview mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_RUN_ID: "77777"
          GITHUB_REPOSITORY: "test-owner/test-repo"
          GITHUB_SHA: "preview123abc"
          GITHUB_ACTOR: "preview-actor"
          GITHUB_ACTION: "preview-action"
          GITHUB_API_URL: "https://api.github.com"
          GITHUB_SERVER_URL: "https://github.com"
          GITHUB_REF: "refs/pull/42/merge"
          GITHUB_EVENT_NAME: "pull_request"
          GITHUB_HEAD_REF: "feature-branch"
          GITHUB_BASE_REF: "main"
        with:
          token: "fake-token-for-testing"
          timeout: "60000"
          error_count: "5"
          reporting_interval: "2000"
          artifact_name: "github-pages"
          preview: "true"

      - name: Assert preview mode action ran and failed at OIDC step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at OIDC token retrieval in act environment.
          # Preview mode is accepted as input but can't complete without real OIDC.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded (no real Pages environment)"
            exit 1
          fi
          echo "PASS: preview mode action failed as expected (OIDC unavailable in act)"
