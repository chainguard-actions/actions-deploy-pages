name: Test preview mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: deploy
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          artifact_name: github-pages
          preview: 'true'
          timeout: '30000'
          error_count: '2'
          reporting_interval: '5000'
      - name: Assert action ran with preview mode (graceful failure expected on sentinel repo)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "page_url: $PAGE_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PAGE_URL" ]; then
              echo "FAIL: action succeeded but page_url output is empty"
              exit 1
            fi
            echo "PASS: preview deployment succeeded with page_url='$PAGE_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo does not support Pages preview)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
