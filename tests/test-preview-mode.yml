name: Test preview mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: deploy
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          artifact_name: github-pages
          timeout: '600000'
          error_count: '10'
          reporting_interval: '5000'
          preview: 'true'
      - name: Assert action ran in preview mode and failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "page_url: $PAGE_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PAGE_URL" ]; then
              echo "FAIL: action succeeded in preview mode but page_url output is empty"
              exit 1
            fi
            echo "PASS: action succeeded in preview mode with page_url='$PAGE_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully in preview mode (sentinel repo is not a real Pages-enabled repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
