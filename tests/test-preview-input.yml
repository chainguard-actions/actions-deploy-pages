name: Test deploy-pages preview input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          artifact_name: 'github-pages-preview-test'
          preview: 'false'
          timeout: '15000'
          reporting_interval: '3000'
          error_count: '1'

      - name: Assert action completed with a valid outcome
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no artifact) or succeed — not crash.
          # The preview=false input should be accepted without error.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with valid outcome '$OUTCOME' — preview input accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
