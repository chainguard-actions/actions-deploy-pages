name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # The action will fail because OIDC token is not available in act,
    # but we verify it fails with the expected error (not a crash)
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_RUN_ID: "12345"
          GITHUB_REPOSITORY: "test-owner/test-repo"
          GITHUB_SHA: "abc123def456"
          GITHUB_ACTOR: "test-actor"
          GITHUB_ACTION: "test-action"
          GITHUB_API_URL: "https://api.github.com"
          GITHUB_SERVER_URL: "https://github.com"
        with:
          token: "fake-token-for-testing"
          timeout: "600000"
          error_count: "10"
          reporting_interval: "5000"
          artifact_name: "github-pages"
          preview: "false"

      - name: Assert action ran and failed with expected OIDC error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (not succeed) because OIDC is unavailable in act
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded (no real Pages environment)"
            exit 1
          fi
          echo "PASS: action failed as expected in local act environment"
