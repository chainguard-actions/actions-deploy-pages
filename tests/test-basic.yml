name: Test basic deploy-pages invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke deploy-pages action (expect failure - no real Pages environment)
        id: action
        uses: .
        with:
          token: fake-token-for-testing
          timeout: '5000'
          error_count: '1'
          reporting_interval: '1000'
          artifact_name: 'github-pages'
          preview: 'false'
        continue-on-error: true

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no real GitHub Pages environment) but not crash unexpectedly
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected in non-Pages environment"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
