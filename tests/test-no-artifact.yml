name: Test deploy-pages with no artifact (expected failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          artifact_name: 'github-pages-nonexistent-test-artifact'
          timeout: '30000'
          reporting_interval: '5000'
          error_count: '2'

      - name: Assert action failed (no artifact available)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no artifact to deploy.
          # A 'success' outcome would be unexpected in this environment.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no artifact to deploy)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded — checking page_url output"
            PAGE_URL="${{ steps.deploy.outputs.page_url }}"
            echo "page_url: $PAGE_URL"
            echo "PASS: action succeeded with page_url=$PAGE_URL"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
