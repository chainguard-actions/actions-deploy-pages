name: Test custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_RUN_ID: "99999"
          GITHUB_REPOSITORY: "test-owner/test-repo"
          GITHUB_SHA: "deadbeef1234"
          GITHUB_ACTOR: "custom-actor"
          GITHUB_ACTION: "custom-action"
          GITHUB_API_URL: "https://api.github.com"
          GITHUB_SERVER_URL: "https://github.com"
        with:
          token: "fake-token-for-testing"
          timeout: "30000"
          error_count: "3"
          reporting_interval: "1000"
          artifact_name: "my-custom-pages-artifact"
          preview: "false"

      - name: Assert action ran and failed at OIDC step (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at OIDC token retrieval, not at input parsing.
          # If it fails, that's expected in act. If it somehow succeeds, that's unexpected.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded (no real Pages environment)"
            exit 1
          fi
          echo "PASS: action failed as expected (OIDC unavailable in act)"
