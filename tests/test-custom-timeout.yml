name: Test deploy-pages with custom timeout settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          artifact_name: 'github-pages-custom-timeout-test'
          timeout: '15000'
          reporting_interval: '3000'
          error_count: '1'

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either fail (no artifact) or succeed.
          # It must NOT produce an unhandled JS exception (which would also be 'failure',
          # but we check that the outcome is one of the two valid terminal states).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with a valid terminal outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — possible crash or cancellation"
            exit 1
          fi

      - name: Assert page_url output is set on success
        if: steps.deploy.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          echo "page_url: $PAGE_URL"
          if [ -z "$PAGE_URL" ]; then
            echo "FAIL: action succeeded but page_url output is empty"
            exit 1
          fi
          echo "PASS: page_url is set to $PAGE_URL"
