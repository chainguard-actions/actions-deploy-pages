name: Test custom timeout and error count
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          artifact_name: github-pages
          timeout: '30000'
          error_count: '5'
          reporting_interval: '3000'
      - name: Assert action ran with custom timeout settings and failed gracefully or succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PAGE_URL: ${{ steps.action.outputs.page_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "page_url: $PAGE_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PAGE_URL" ]; then
              echo "FAIL: action succeeded but page_url output is empty"
              exit 1
            fi
            echo "PASS: deployed successfully with custom timeout settings, page_url=$PAGE_URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not a real Pages-enabled repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
