name: Test timeout input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with very short timeout
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          timeout: '1000'
          error_count: '1'
          reporting_interval: '500'
          artifact_name: 'github-pages'
          preview: 'false'
        continue-on-error: true
      - name: Assert action ran and did not hang
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (timeout or failure both acceptable for short timeout)"
