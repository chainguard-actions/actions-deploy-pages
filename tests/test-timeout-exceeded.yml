name: Test timeout exceeding maximum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_RUN_ID: "55555"
          GITHUB_REPOSITORY: "test-owner/test-repo"
          GITHUB_SHA: "timeout123abc"
          GITHUB_ACTOR: "timeout-actor"
          GITHUB_ACTION: "timeout-action"
          GITHUB_API_URL: "https://api.github.com"
          GITHUB_SERVER_URL: "https://github.com"
        with:
          token: "fake-token-for-testing"
          # Timeout value exceeding the maximum of 600000ms — action should warn and cap it
          timeout: "9999999"
          error_count: "10"
          reporting_interval: "5000"
          artifact_name: "github-pages"
          preview: "false"

      - name: Assert action ran and failed at OIDC step (not at timeout validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at OIDC token retrieval, not at timeout validation.
          # Timeout > MAX_TIMEOUT only emits a warning, not an error.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded (no real Pages environment)"
            exit 1
          fi
          echo "PASS: action failed as expected (OIDC unavailable in act)"
