name: Test custom artifact name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          artifact_name: my-custom-pages-artifact
          timeout: '60000'
      - name: Assert action ran with custom artifact name and failed gracefully or succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PAGE_URL: ${{ steps.action.outputs.page_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "page_url: $PAGE_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PAGE_URL" ]; then
              echo "FAIL: action succeeded but page_url output is empty"
              exit 1
            fi
            echo "PASS: deployed successfully with custom artifact name, page_url=$PAGE_URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not a real Pages-enabled repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
